engine:
  max_consecutive_failures: 2
  base_branch: master
  commit:
    mode: trunk
    push: true

triage:
  agent: claudecode
  prompt: prompts/triage.md
  max_turns: 10

workflows:
  # LOCAL DIVERGENCE FROM src/defaults/workflows.yml
  # This repo's workflows.yml adds a 'document' workflow not present in src/defaults.
  # The sync-defaults divergence guard preserves this file when syncing.
  # engine.commit (mode: trunk, push: true) is now set in the engine block above;
  # commit steps have been removed from all workflows.
  - name: feature
    description: Full SDLC pass for a single cycle of work.
    max_cycle_attempts: 3
    steps:
      - { name: spec,     agent: claudecode, prompt: prompts/spec.md }
      - { name: research, agent: claudecode, prompt: prompts/research.md }
      - { name: plan,     agent: claudecode, prompt: prompts/plan.md }
      - { name: build,    agent: claudecode, prompt: prompts/build.md }
      - { name: review,   agent: claudecode, prompt: prompts/review.md }
      - { name: fix,      agent: claudecode, prompt: prompts/fix.md, skip_unless: MUST-FIX.md }
      - { name: verify,   agent: bash,       command: scripts/verify.sh }
      - { name: documentation, agent: claudecode, prompt: prompts/documentation.md }

  # Documentation-only workflow: doc/prompt edits, no code changes.
  # No reflection (don't compound from doc work). engine.commit handles commit.
  - name: document
    description: Documentation- and prompt-only edits. No code, no tests, no reflection.
    max_cycle_attempts: 3
    steps:
      - { name: plan_documents,   agent: claudecode, prompt: prompts/plan_documents.md }
      - { name: authoring,        agent: claudecode, prompt: prompts/authoring.md }
      - { name: review_documents, agent: claudecode, prompt: prompts/review_documents.md }
      - { name: verify,           agent: bash,       command: scripts/verify.sh }

  - name: quickfix
    description: Surgical fix for a well-scoped issue. Plan → fix → test.
    max_cycle_attempts: 3
    steps:
      - { name: plan_fix,  agent: claudecode, prompt: prompts/plan_fix.md }
      - { name: quick_fix, agent: claudecode, prompt: prompts/quick_fix.md }
      - { name: test_fix,  agent: claudecode, prompt: prompts/test_fix.md }
      - { name: verify,    agent: bash,       command: scripts/verify.sh }

  - name: e2e-tests
    description: Write or extend Playwright end-to-end tests against the running app.
    max_cycle_attempts: 3
    steps:
      - { name: research,   agent: claudecode, prompt: prompts/research.md }
      - { name: test_plan,  agent: claudecode, prompt: prompts/test-plan.md }
      - { name: test_build, agent: claudecode, prompt: prompts/test-build.md }
      - { name: review,     agent: claudecode, prompt: prompts/review.md }
      - { name: fix,        agent: claudecode, prompt: prompts/fix.md, skip_unless: MUST-FIX.md }
      - { name: verify,     agent: bash,       command: scripts/verify.sh }
