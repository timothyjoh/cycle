engine:
  max_consecutive_failures: 2
  base_branch: master

triage:
  agent: claudecode
  prompt: prompts/triage.md
  max_turns: 10

workflows:
  - name: feature
    description: Full SDLC pass for a single cycle of work.
    max_cycle_attempts: 3
    steps:
      - { name: spec,     agent: claudecode, prompt: prompts/spec.md }
      - { name: research, agent: claudecode, prompt: prompts/research.md }
      - { name: plan,     agent: claudecode, prompt: prompts/plan.md }
      - { name: build,    agent: claudecode, prompt: prompts/build.md }
      - { name: review,   agent: claudecode, prompt: prompts/review.md }
      - { name: fix,      agent: claudecode, prompt: prompts/fix.md, skip_unless: MUST-FIX.md }
      - { name: verify,   agent: bash,       command: scripts/verify.sh }
      - { name: commit,   agent: bash,       command: scripts/commit.sh }
      - { name: pr,       agent: bash,       command: scripts/pr.sh }
      - { name: reflection, agent: claudecode, prompt: prompts/reflection.md }
      - { name: documentation, agent: claudecode, prompt: prompts/documentation.md }

  - name: quickfix
    description: Surgical fix for a well-scoped issue. Plan → fix → test. No spec, no research, no PR review.
    max_cycle_attempts: 3
    steps:
      - { name: plan_fix,  agent: claudecode, prompt: prompts/plan_fix.md }
      - { name: quick_fix, agent: claudecode, prompt: prompts/quick_fix.md }
      - { name: test_fix,  agent: claudecode, prompt: prompts/test_fix.md }
      - { name: verify,    agent: bash,       command: scripts/verify.sh }
      - { name: commit,    agent: bash,       command: scripts/commit.sh }
      - { name: pr,        agent: bash,       command: scripts/pr.sh }

  - name: e2e-tests
    description: Write or extend Playwright end-to-end tests against the running app. Works directly on the base branch — no per-cycle branch, no PR.
    max_cycle_attempts: 3
    no_branch: true
    steps:
      - { name: research,   agent: claudecode, prompt: prompts/research.md }
      - { name: test_plan,  agent: claudecode, prompt: prompts/test-plan.md }
      - { name: test_build, agent: claudecode, prompt: prompts/test-build.md }
      - { name: review,     agent: claudecode, prompt: prompts/review.md }
      - { name: fix,        agent: claudecode, prompt: prompts/fix.md, skip_unless: MUST-FIX.md }
      - { name: verify,     agent: bash,       command: scripts/verify.sh }
      - { name: commit,     agent: bash,       command: scripts/commit-trunk.sh }
